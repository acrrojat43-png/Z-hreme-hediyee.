<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zühre İçin Özel Sürpriz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .game-container {
            width: 90%;
            max-width: 400px;
            height: 300px;
            border: 3px solid white;
            border-radius: 15px;
            position: relative;
            background: rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .proposal {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease-in-out;
        }
        .proposal h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="gameScreen">
        <h1>🏐 Zühre, Voleybol Maçına Hazır Mısın? 🏐</h1>
        <p style="margin-bottom: 20px;">Sürprizi görmek için butona tıkla!</p>
        <button class="btn" onclick="startProposal()">Topa Vur & Sürprizi Gör!</button>
    </div>

    <div class="proposal" id="proposalScreen">
        <h2>Zühre'm, Benimle Evlenir Misin? 💍❤️</h2>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">Kalbimin tek sahibisin!</p>
        <button class="btn" onclick="alert('Evet dedi! Dünyanın en mutlu insanısın Rojat! 🎉')">EVET! 🥰</button>
    </div>

    <script>
        function startProposal() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('proposalScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
